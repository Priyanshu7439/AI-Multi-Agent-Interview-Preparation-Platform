version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_prep_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/workspace/chroma_db
      - ./interview_platform.db:/workspace/interview_platform.db
    restart: always
